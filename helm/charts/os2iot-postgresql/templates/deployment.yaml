kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ $.Chart.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    helm.sh/chart: "{{ $.Chart.Name }}-{{ $.Chart.Version }}"
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Chart.Name }}-{{ .Values.DOCKER_IMAGE_TAG }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.REPLICAS }}
  selector:
    matchLabels:
      app: {{ $.Chart.Name }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  revisionHistoryLimit: {{ .Values.REVISION_HISTORY_LIMIT }}
  template:
    metadata:
      labels:
        app: {{ $.Chart.Name }}
        version: "{{ $.Chart.Name }}-{{ .Values.DOCKER_IMAGE_TAG }}"
    spec:
      containers:
        - name: {{ $.Chart.Name }}
          image: "{{ .Values.CONTAINER_REGISTRY }}/{{ .Values.DOCKER_IMAGE_NAME }}:{{ .Values.DOCKER_IMAGE_TAG }}"
          imagePullPolicy: {{ .Values.DOCKER_IMAGE_PULL_POLICY }}
          ports:
            - name: db
              containerPort: 5432
              protocol: TCP
          resources:
            limits:
              cpu: 150m
              memory: 512Mi
            requests:
              cpu: 5m
              memory: 128Mi
          # Custom bellow:
          env:
            - name: POSTGRES_DB
              value: {{ .Values.POSTGRES_DB | default "os2iot" }}
            - name: POSTGRES_USER
              value: {{ .Values.POSTGRES_USER | default "os2iot" }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName | default "os2iot-secrets" }}
                  key: POSTGRES_PASSWORD
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName | default "os2iot-secrets" }}
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["psql", "-w", "-U", "os2iot", "-d", "os2iot", "-c", "SELECT 1"]
            initialDelaySeconds: 15
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: ["psql", "-w", "-U", "os2iot", "-d", "os2iot", "-c", "SELECT 1"]
            initialDelaySeconds: 45
            timeoutSeconds: 2
      restartPolicy: Always
